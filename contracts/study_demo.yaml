contract_version: 0.1.0-draft
source: TIG-2026-001
tier: deidentified
anchor:
  domain: DM
  subject_column: USUBJID
  date_column: RFSTDTC
  convention: day1
risk:
  domain: DM
  k_target: 5
  sensitive_columns: []
  fail_on_target_miss: false
domains:
- name: AE
  subject_key: USUBJID
  retained_in_full: true
  fields:
  - column: STUDYID
    treatment: retain
  - column: DOMAIN
    treatment: retain
  - column: USUBJID
    treatment: surrogate_id
    note: 'random surrogate, not derived from the original: EDC subject IDs encode
      country, site and enrolment order'
    entity: subject
    prefix: SUBJ
  - column: AESEQ
    treatment: retain
  - column: AETERM
    treatment: screen_freetext
    note: 'screened, not rewritten: candidates go to a review queue and unflagged
      rows publish as received; required for regulatory review in this domain'
  - column: AEDECOD
    treatment: retain
  - column: AEBODSYS
    treatment: retain
  - column: AESEV
    treatment: retain
  - column: AESER
    treatment: retain
  - column: AEREL
    treatment: retain
  - column: AEOUT
    treatment: retain
  - column: AEACN
    treatment: retain
  - column: AESTDTC
    treatment: date_to_study_day
    note: 'reparameterisation, not redaction: intervals preserved'
  - column: AEENDTC
    treatment: date_to_study_day
    note: 'reparameterisation, not redaction: intervals preserved'
  - column: AEENRF
    treatment: retain
    note: 'REVIEW: unrecognised column'
- name: DM
  subject_key: USUBJID
  fields:
  - column: STUDYID
    treatment: retain
  - column: DOMAIN
    treatment: retain
  - column: USUBJID
    treatment: surrogate_id
    note: 'random surrogate, not derived from the original: EDC subject IDs encode
      country, site and enrolment order'
    entity: subject
    prefix: SUBJ
  - column: SUBJID
    treatment: drop
    note: redundant with USUBJID, and encodes site and enrolment order
  - column: SITEID
    treatment: surrogate_id
    note: a site with very few subjects is itself identifying; consider pooling low-enrolment
      sites into a region
    entity: site
    prefix: SITE
    is_quasi_identifier: true
  - column: INVNAM
    treatment: drop
  - column: BRTHDTC
    treatment: drop
    note: AGE is already present in this domain, so the date of birth adds nothing
      analytically and is a direct identifier
  - column: AGE
    treatment: cap_numeric
    note: 'exact years below 90, a single 90+ band above it: extreme ages are near-unique,
      ordinary ones are not'
    cap: 90
    is_quasi_identifier: true
  - column: AGEU
    treatment: retain
  - column: SEX
    treatment: retain
    is_quasi_identifier: true
  - column: RACE
    treatment: retain
    is_quasi_identifier: true
  - column: ETHNIC
    treatment: retain
    is_quasi_identifier: true
  - column: COUNTRY
    treatment: retain
    is_quasi_identifier: true
  - column: SITEZIP
    treatment: zip3
    is_quasi_identifier: true
  - column: ARM
    treatment: retain
    note: 'REVIEW: unrecognised column'
  - column: RFSTDTC
    treatment: date_to_study_day
    note: the anchor itself; becomes Day 1 by construction
  - column: RFENDTC
    treatment: date_to_study_day
    note: 'reparameterisation, not redaction: intervals preserved'
  - column: SUBJPHONE
    treatment: drop
