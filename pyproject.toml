[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deidkit"
version = "0.1.0"
description = "De-identification pipeline for inbound EDC / SDTM clinical data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Presidio gives proper NER for the free-text screen. Without it the built-in
# pattern detector runs instead -- usable, but weaker on person names.
screening = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# SAS transport and sas7bdat readers, for real EDC exports.
sas = ["pyreadstat>=1.2"]
# Realistic surrogate values for direct identifiers whose column must persist.
surrogates = ["faker>=24.0"]
# Parquet output for the published tiers.
parquet = ["pyarrow>=15.0"]
dev = ["pytest>=8.0"]
# Cloud backends. Each pulls the key-service SDK plus the fsspec filesystem for
# that provider's object storage, so quarantine and the tiers can live in
# separate buckets rather than separate directories.
aws = ["boto3>=1.34", "s3fs>=2024.2"]
azure = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8", "adlfs>=2024.2"]
gcp = ["google-cloud-kms>=2.21", "gcsfs>=2024.2"]
all = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "pyreadstat>=1.2",
    "faker>=24.0",
    "pyarrow>=15.0",
    # pytest is included here on purpose: the setup scripts run the suite as an
    # install self-check, and a validated install is the point of running them.
    "pytest>=8.0",
]

[project.scripts]
deidkit = "deidkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
